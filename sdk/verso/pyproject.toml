[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verso-build-sdk"
version = "0.1.0"
description = "Transport-neutral SDK for building Verso/Lake sites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["reasbook-sdk-common==0.1.0"]

[project.scripts]
verso-build = "verso_build_sdk.cli:main"
verso-literate = "verso_build_sdk.literate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verso_build_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "../common/src"]
