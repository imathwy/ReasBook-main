[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparator-sdk"
version = "0.1.0"
description = "Transport-neutral local SDK for Lean Comparator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["reasbook-sdk-common==0.1.0"]

[project.scripts]
comparator = "comparator_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comparator_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "../common/src"]
