name: Check toolchain

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect stable Lean release
        id: release
        run: |
          set -euo pipefail
          latest="$(python3 scripts/upgrade_toolchain.py --latest-check)"
          current="$(sed 's/leanprover\/lean4:v//' ReasBook/lean-toolchain)"
          if [ "$latest" != "$current" ]; then echo "version=$latest" >> "$GITHUB_OUTPUT"; fi

  upgrade:
    needs: detect
    if: needs.detect.outputs.version != ''
    uses: ./.github/workflows/automation.yml
    with:
      operation: upgrade
      version: ${{ needs.detect.outputs.version }}
