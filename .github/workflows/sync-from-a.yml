name: Sync from ALLBOOKS

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      book:
        description: Exact mapped book name; empty means all
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/automation.yml
    with:
      operation: sync
      book: ${{ inputs.book }}
    secrets:
      A_REPO_PAT: ${{ secrets.A_REPO_PAT }}
