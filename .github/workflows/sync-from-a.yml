name: Sync from ALLBOOKS

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Canonical project kind
        type: choice
        options: [book, paper]
        default: book
        required: true
      project:
        description: Exact canonical ReasBook project name
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  inventory:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wl-ma/ALLBOOKS
          token: ${{ secrets.A_REPO_PAT }}
          path: .automation/source-a
      - name: Read-only ALLBOOKS inventory
        run: python3 scripts/sync_from_a.py --source .automation/source-a --all --dry-run

  sync:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/automation.yml
    with:
      operation: sync
      book: ${{ inputs.kind == 'book' && inputs.project || '' }}
      paper: ${{ inputs.kind == 'paper' && inputs.project || '' }}
    secrets:
      A_REPO_PAT: ${{ secrets.A_REPO_PAT }}
