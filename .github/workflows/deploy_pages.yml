name: Deploy Verso Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_deploy:
        description: 'Run full monolithic build+deploy (recommended)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-projects:
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    outputs:
      version_branches: ${{ steps.collect.outputs.version_branches }}
      version_branch_count: ${{ steps.collect.outputs.version_branch_count }}
      projects: ${{ steps.collect.outputs.projects }}
      full_deploy: ${{ steps.collect.outputs.full_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect books/papers across version branches
        id: collect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          # Read version branches from the public registry (facts only).
          text = Path("config/toolchains.yml").read_text(encoding="utf-8")
          # Minimal YAML branch extractor (avoids a yaml dependency on the runner).
          branches = []
          for m in re.finditer(r"^\s*-\s*version:\s*(\S+)\s*$", text, re.MULTILINE):
              branches.append(m.group(1))
          # Keep only branches that actually exist as git refs.
          # Use origin/<branch> refs: a fresh checkout only has remote-tracking refs,
          # not local branches named vX.Y.0.
          existing = []
          for b in branches:
              try:
                  subprocess.run(
                      ["git", "rev-parse", "--verify", "--quiet", f"origin/{b}"],
                      check=True, capture_output=True,
                  )
                  existing.append(b)
              except subprocess.CalledProcessError:
                  pass
          branches = existing

          projects = []
          seen = {}  # (kind, name) -> index; newer branch wins for duplicates
          branches_with_projects = set()

          for branch in branches:
              for kind_dir, kind_slug, kind_title, leaf in [
                  ("ReasBook/Books", "books", "Books", "Book"),
                  ("ReasBook/Papers", "papers", "Papers", "Paper"),
              ]:
                  try:
                      out = subprocess.run(
                          ["git", "ls-tree", "-r", "--name-only", f"origin/{branch}", kind_dir],
                          check=True, capture_output=True, text=True,
                      ).stdout
                  except subprocess.CalledProcessError:
                      continue
                  for line in out.splitlines():
                      parts = line.split("/")
                      # Only the top-level book root module: ReasBook/Books/<BookId>/Book.lean
                      if len(parts) == 4 and parts[3] == f"{leaf}.lean":
                          name = parts[2]
                          key = (kind_slug, name)
                          branches_with_projects.add(branch)
                          entry = {
                              "kind": kind_slug,
                              "kindTitle": kind_title,
                              "name": name,
                              "slug": name.lower(),
                              "branch": branch,
                          }
                          if key in seen:
                              projects[seen[key]] = entry  # newer branch overwrites
                          else:
                              seen[key] = len(projects)
                              projects.append(entry)

          # Only build branches that actually carry books/papers (skip empty receivers).
          branches = [b for b in branches if b in branches_with_projects]

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event_payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))

          if event_name in {"push"}:
              full_deploy = True
          elif event_name == "workflow_dispatch":
              raw = str((event_payload.get("inputs") or {}).get("full_deploy", "true")).strip().lower()
              full_deploy = raw in {"1", "true", "yes", "on"}
          else:
              full_deploy = False

          print(f"version_branches={json.dumps(branches, separators=(',', ':'))}")
          print(f"version_branch_count={len(branches)}")
          print(f"projects={json.dumps(projects, separators=(',', ':'))}")
          print(f"full_deploy={'true' if full_deploy else 'false'}")
          PY

  build-branch-sites:
    needs: discover-projects
    if: needs.discover-projects.outputs.version_branch_count != '0'
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: ${{ fromJSON(needs.discover-projects.outputs.version_branches) }}
    env:
      HEARTBEAT_INTERVAL_SECONDS: 45
      RETRY_ON_143_MAX_RETRIES: 1
      RETRY_ON_143_SLEEP_SECONDS: 20
      PERSIST_ROOT: ${{ vars.REASBOOK_PERSIST_ROOT }}
      BRANCH: ${{ matrix.branch }}
      REASBOOK_DOMAIN: ${{ vars.REASBOOK_DOMAIN }}
      REASBOOK_ROOT_PATH: ${{ vars.REASBOOK_ROOT_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Checkout theorem-map generator from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .reasbook-main
          sparse-checkout: |
            tools/theorem_map

      - name: Prepare persistent build directories
        run: |
          set -euo pipefail
          repo_key="${GITHUB_REPOSITORY//\//_}"
          persist_base="${PERSIST_ROOT:-${HOME:-/root}/.cache/reasbook-ci/$repo_key}"
          persist_root="$persist_base/$BRANCH"
          echo "PERSIST_ROOT=$persist_root" >> "$GITHUB_ENV"
          echo "Using persistent root: $persist_root"
          # Per-branch isolation is keyed by $BRANCH (the version), not the triggering ref.
          mkdir -p "$persist_root/reasbook_lake" \
                   "$persist_root/reasbookweb_lake"
          rm -rf ReasBook/.lake ReasBookWeb/.lake
          ln -sfn "$persist_root/reasbook_lake" ReasBook/.lake
          ln -sfn "$persist_root/reasbookweb_lake" ReasBookWeb/.lake

      - name: Install elan (Lean toolchain manager)
        run: |
          if [ ! -x "${HOME:-/root}/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi

      - name: Restore ReasBook build cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ReasBook/.lake/build/bin
            ReasBook/.lake/build/lib/lean
          key: lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}
          restore-keys: |
            lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-
            lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore ReasBook doc-data cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ReasBook/.lake/build/doc-data
          key: lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}
          restore-keys: |
            lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-
            lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore ReasBook doc cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ReasBook/.lake/build/doc
          key: lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-
            lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-
            lake-reasbook-doc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-
            lake-reasbook-doc-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore ReasBookWeb build cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ReasBookWeb/.lake/build/bin
            ReasBookWeb/.lake/build/lib/lean
          key: lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBookWeb/lean-toolchain') }}-${{ hashFiles('ReasBookWeb/lake-manifest.json') }}
          restore-keys: |
            lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBookWeb/lean-toolchain') }}-
            lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Prime ReasBook cache
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if ! ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_cache.sh (${BRANCH})" ./scripts/build_reasbook_cache.sh; then
            echo "[${BRANCH}] cache get failed; continuing with local build"
          fi

      - name: Build ReasBook core target
        timeout-minutes: 90
        run: |
          set -euo pipefail
          ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_core.sh (${BRANCH})" ./scripts/build_reasbook_core.sh

      - name: Build ReasBookWeb (sections + Verso)
        timeout-minutes: 180
        run: |
          set -euo pipefail
          ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_web.sh (${BRANCH})" ./scripts/build_reasbook_web.sh

      - name: Build shared docs (${BRANCH})
        timeout-minutes: 180
        run: |
          set -euo pipefail
          if [ -f ReasBook/.lake/build/doc/index.html ] && [ -f ReasBook/.lake/build/doc/.reasbook-docs-marker ]; then
            expected="$(git rev-parse HEAD:ReasBook)"
            actual="$(tr -d '\r\n' < ReasBook/.lake/build/doc/.reasbook-docs-marker)"
            if [ "$actual" = "$expected" ]; then
              echo "[${BRANCH}] docs cache valid; skipping docs build"
              exit 0
            fi
          fi
          ulimit -s unlimited 2>/dev/null || true
          ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_shared_docs.sh (${BRANCH})" ./scripts/build_reasbook_shared_docs.sh
          # Per-project docs: build each module separately so one book's doc-gen crash
          # (e.g. SIGSEGV on a huge book like Klenke) does not fail the whole branch.
          # Module name depends on lakefile style:
          #   v4.26.0: lean_lib Books  -> module = Books.XXX.Book
          #   v4.30.0+: lean_lib XXX where srcDir := "Books" -> module = XXX.Book
          failed=""
          cd ReasBook
          has_books_lib=false
          has_papers_lib=false
          if grep -qE 'lean_lib\s+[«"]?Books[»"]?\s' lakefile.lean 2>/dev/null; then has_books_lib=true; fi
          if grep -qE 'lean_lib\s+[«"]?Papers[»"]?\s' lakefile.lean 2>/dev/null; then has_papers_lib=true; fi
          for entry in Books/*/Book.lean Papers/*/Paper.lean; do
            [ -f "$entry" ] || continue
            kind="${entry%%/*}"  # "Books" or "Papers"
            # Determine whether this kind uses a flat lib (no prefix)
            if [ "$kind" = "Books" ] && [ "$has_books_lib" = "true" ]; then
              mod="${entry%.lean}"; mod="${mod//\//.}"
            elif [ "$kind" = "Papers" ] && [ "$has_papers_lib" = "true" ]; then
              mod="${entry%.lean}"; mod="${mod//\//.}"
            else
              # Flat: lean_lib XXX where srcDir := "Books/Papers" — strip the kind prefix
              inner="${entry#*/}"  # e.g. AlgebraicTopology_May_1999/Book.lean
              mod="${inner%.lean}"; mod="${mod//\//.}"
            fi
            log="${RUNNER_TEMP:-/tmp}/docgen-${mod//./_}.log"
            if ! lake -R -Kenv=dev build "$mod:docs" > "$log" 2>&1; then
              echo "[docs] FAILED: ${mod} (site continues without it)"
              tail -5 "$log" || true
              failed="$failed $mod"
            fi
          done
          cd ..
          if [ -n "$failed" ]; then
            echo "[docs] doc failures (skipping docs-marker so next run retries):${failed}"
          else
            marker="$(git rev-parse HEAD:ReasBook)"
            printf '%s\n' "$marker" > ReasBook/.lake/build/doc/.reasbook-docs-marker
          fi

      - name: Assemble docs under ReasBookWeb/_site/docs
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./scripts/ci_heartbeat.sh "assemble_site_docs.sh (${BRANCH})" ./scripts/assemble_site_docs.sh

      - name: Generate theorem dependency maps (${BRANCH})
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python3 .reasbook-main/tools/theorem_map/generate_all.py \
            --repo-root . \
            --site-root ReasBookWeb/_site \
            --branch "$BRANCH" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --extractor .reasbook-main/tools/theorem_map/Extract.lean \
            --assets .reasbook-main/tools/theorem_map/assets

      - name: Upload branch site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.branch }}
          path: ReasBookWeb/_site
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: true

      - name: Save ReasBook build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ReasBook/.lake/build/bin
            ReasBook/.lake/build/lib/lean
          key: lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}

      - name: Save ReasBookWeb build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ReasBookWeb/.lake/build/bin
            ReasBookWeb/.lake/build/lib/lean
          key: lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ReasBookWeb/lean-toolchain') }}-${{ hashFiles('ReasBookWeb/lake-manifest.json') }}

  merge-branch-sites:
    needs:
      - discover-projects
      - build-branch-sites
    if: always() && needs.build-branch-sites.result == 'success'
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    env:
      VERSION_BRANCHES: ${{ needs.discover-projects.outputs.version_branches }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all branch site artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: .artifacts/branches

      - name: Merge branch sites (newest version wins)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path

          branches = json.loads(os.environ["VERSION_BRANCHES"])
          src_root = Path(".artifacts/branches")
          # NOTE: use a NON-hidden directory name ("site", not ".site") because
          # actions/upload-artifact@v4 excludes dot-prefixed (hidden) paths by default.
          dst_root = Path("site")
          if dst_root.exists():
              shutil.rmtree(dst_root)
          dst_root.mkdir(parents=True)

          # Each artifact is extracted under .artifacts/branches/site-<branch>/.
          # Copy oldest -> newest so newer branches overwrite duplicates (docs, books, papers).
          for branch in branches:
              src = src_root / f"site-{branch}"
              if not src.is_dir():
                  print(f"warning: no artifact for {branch}")
                  continue
              for item in src.iterdir():
                  dst = dst_root / item.name
                  if item.is_dir():
                      shutil.copytree(item, dst, dirs_exist_ok=True)
                  else:
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item, dst)
              print(f"merged {branch}")

          # Basic sanity: the site must have a root index (Verso builds one).
          if not (dst_root / "index.html").is_file():
              print("warning: merged site has no root index.html")
          PY

      - name: Upload merged site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-monolith
          path: site
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: true

  assemble-pages-artifact:
    needs:
      - discover-projects
      - merge-branch-sites
    if: always() && needs.merge-branch-sites.result == 'success'
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    outputs:
      pages_artifact_name: ${{ steps.pages_artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download merged site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-monolith
          path: .artifacts/monolith

      - name: Assemble partitioned sites tree
        env:
          PROJECTS_JSON: ${{ needs.discover-projects.outputs.projects }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          projects = json.loads(os.environ["PROJECTS_JSON"])
          src_root = Path(".artifacts/monolith")
          dst_root = Path(".site")

          if dst_root.exists():
              shutil.rmtree(dst_root)
          shutil.copytree(src_root, dst_root)

          sites_root = dst_root / "sites"
          sites_root.mkdir(parents=True, exist_ok=True)

          for p in projects:
              slug = p["slug"]
              kind = p["kind"]
              kind_title = p["kindTitle"]
              name = p["name"]

              pages_src = dst_root / kind / slug
              docs_src = dst_root / "docs" / "ReasBook" / kind_title / name
              map_src = dst_root / "theorem-maps" / kind / slug
              site_dir = sites_root / slug

              if site_dir.exists():
                  shutil.rmtree(site_dir)
              site_dir.mkdir(parents=True, exist_ok=True)

              if pages_src.is_dir():
                  shutil.copytree(pages_src, site_dir / "pages")
              if docs_src.is_dir():
                  shutil.copytree(docs_src, site_dir / "docs")

              navigation = []
              if pages_src.is_dir():
                  navigation.append('    <li><a href="./pages/">Pages</a></li>')
              if docs_src.is_dir():
                  navigation.append('    <li><a href="./docs/">Documentation</a></li>')
              if map_src.is_dir():
                  navigation.append(
                      f'    <li><a href="../../theorem-maps/{kind}/{slug}/">Theorem map</a></li>'
                  )

              index = site_dir / "index.html"
              index.write_text(
                  "\n".join(
                      [
                          "<!doctype html>",
                          '<html lang="en">',
                          "<head>",
                          '  <meta charset="utf-8" />',
                          '  <meta name="viewport" content="width=device-width,initial-scale=1" />',
                          f"  <title>{name}</title>",
                          "</head>",
                          "<body>",
                          f"  <h1>{name}</h1>",
                          "  <ul>",
                          *navigation,
                          "  </ul>",
                          '  <p><a href="../../">Back to root</a></p>',
                          "</body>",
                          "</html>",
                          "",
                      ]
                  ),
                  encoding="utf-8",
              )

          root_index = dst_root / "index.html"
          if not root_index.exists():
              links = "\n".join(
                  f'    <li><a href="./sites/{p["slug"]}/">{p["name"]}</a></li>' for p in projects
              )
              root_index.write_text(
                  "\n".join(
                      [
                          "<!doctype html>",
                          '<html lang="en">',
                          "<head>",
                          '  <meta charset="utf-8" />',
                          '  <meta name="viewport" content="width=device-width,initial-scale=1" />',
                          "  <title>ReasBook</title>",
                          "</head>",
                          "<body>",
                          "  <h1>ReasBook</h1>",
                          "  <h2>Independent Sites</h2>",
                          "  <ul>",
                          links,
                          "  </ul>",
                          "</body>",
                          "</html>",
                          "",
                      ]
                  ),
                  encoding="utf-8",
              )
          PY

      - name: Rebuild cross-version theorem-map catalog
        run: |
          set -euo pipefail
          python3 tools/theorem_map/catalog.py --site-root .site

      - name: Verify generated site tree
        run: |
          set -euo pipefail
          ls -la .site
          test -d .site/docs
          test -f .site/theorem-maps/index.html

      - name: Compute Pages artifact name
        id: pages_artifact_name
        run: |
          set -euo pipefail
          echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact_name.outputs.name }}
          path: .site

  deploy:
    needs: assemble-pages-artifact
    if: always() && needs.assemble-pages-artifact.result == 'success'
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs['assemble-pages-artifact'].outputs.pages_artifact_name }}
          path: .site

      - name: Deploy to local web root
        run: |
          set -euo pipefail
          rsync -av --delete .site/ /var/www/reasbook/

      - name: Reload nginx
        run: |
          sudo nginx -t && sudo systemctl reload nginx

      - name: Print deployed URL
        run: |
          echo "ReasBook deployed to http://localhost:19080 (systemd) and /var/www/reasbook (nginx)"
