name: Deploy Verso Site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      full_deploy:
        description: 'Run full monolithic build+deploy (recommended)'
        required: false
        default: true
        type: boolean
      only_branches:
        description: 'Comma-separated branch versions to build (empty = all active branches)'
        required: false
        default: ''
        type: string
      skip_branches:
        description: 'Comma-separated branch versions to skip (empty = none)'
        required: false
        default: ''
        type: string
      only_projects:
        description: 'Comma-separated project directory names to build (empty = all projects)'
        required: false
        default: ''
        type: string
      skip_projects:
        description: 'Comma-separated project directory names to skip (empty = none)'
        required: false
        default: ''
        type: string
      max_parallel_branches:
        description: 'Maximum concurrent branch jobs; 0 = auto-detect from CPU'
        required: false
        default: '0'
        type: string
      max_parallel_projects:
        description: 'Maximum concurrent per-project docs builds; 0 = auto-detect from CPU'
        required: false
        default: '0'
        type: string
      reuse_branch_sites:
        description: 'Reuse unchanged branch site artifacts from the persistent cache'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-projects:
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    outputs:
      version_branches: ${{ steps.collect.outputs.version_branches }}
      version_branch_count: ${{ steps.collect.outputs.version_branch_count }}
      projects: ${{ steps.collect.outputs.projects }}
      full_deploy: ${{ steps.collect.outputs.full_deploy }}
      excluded_projects_csv: ${{ steps.collect.outputs.excluded_projects_csv }}
      only_projects_csv: ${{ steps.collect.outputs.only_projects_csv }}
      max_parallel_branches: ${{ steps.collect.outputs.max_parallel_branches }}
      doc_parallelism: ${{ steps.collect.outputs.doc_parallelism }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect books/papers across version branches
        id: collect
        env:
          REASBOOK_ONLY_BRANCHES: ${{ inputs.only_branches }}
          REASBOOK_SKIP_BRANCHES: ${{ inputs.skip_branches }}
          REASBOOK_ONLY_PROJECTS: ${{ inputs.only_projects }}
          REASBOOK_SKIP_PROJECTS: ${{ inputs.skip_projects }}
          REASBOOK_MAX_PARALLEL_BRANCHES: ${{ inputs.max_parallel_branches }}
          REASBOOK_MAX_PARALLEL_PROJECTS: ${{ inputs.max_parallel_projects }}
        run: |
          python3 scripts/discover_projects.py >> "$GITHUB_OUTPUT"

  build-branch-sites:
    needs: discover-projects
    if: needs.discover-projects.outputs.version_branch_count != '0'
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.discover-projects.outputs.max_parallel_branches) }}
      matrix:
        branch: ${{ fromJSON(needs.discover-projects.outputs.version_branches) }}
    env:
      HEARTBEAT_INTERVAL_SECONDS: 45
      RETRY_ON_143_MAX_RETRIES: 1
      RETRY_ON_143_SLEEP_SECONDS: 20
      PERSIST_ROOT: ${{ vars.REASBOOK_PERSIST_ROOT }}
      BRANCH: ${{ matrix.branch }}
      REASBOOK_DOMAIN: ${{ vars.REASBOOK_DOMAIN }}
      REASBOOK_ROOT_PATH: ${{ vars.REASBOOK_ROOT_PATH }}
      REASBOOK_EXCLUDED_PROJECTS: ${{ needs.discover-projects.outputs.excluded_projects_csv }}
      REASBOOK_ONLY_PROJECTS: ${{ needs.discover-projects.outputs.only_projects_csv }}
      REASBOOK_DOC_PARALLELISM: ${{ needs.discover-projects.outputs.doc_parallelism }}
      REASBOOK_REUSE_BRANCH_SITES: ${{ inputs.reuse_branch_sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Checkout theorem-map generator from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .reasbook-main
          sparse-checkout: |
            tools/theorem_map

      - name: Prepare persistent build directories
        run: |
          set -euo pipefail
          repo_key="${GITHUB_REPOSITORY//\//_}"
          persist_base="${PERSIST_ROOT:-${HOME:-/root}/.cache/reasbook-ci/$repo_key}"
          persist_root="$persist_base/$BRANCH"
          echo "PERSIST_ROOT=$persist_root" >> "$GITHUB_ENV"
          echo "Using persistent root: $persist_root"
          # Per-branch isolation is keyed by $BRANCH (the version), not the triggering ref.
          mkdir -p "$persist_root/reasbook_lake" \
                   "$persist_root/reasbookweb_lake"
          rm -rf ReasBook/.lake ReasBookWeb/.lake
          ln -sfn "$persist_root/reasbook_lake" ReasBook/.lake
          ln -sfn "$persist_root/reasbookweb_lake" ReasBookWeb/.lake
          # Decompress any previously compressed build subdirs
          ./scripts/decompress_persistent_cache.sh "$persist_root/reasbook_lake" || true

      - name: Reuse cached branch site
        id: branch_site_reuse
        run: |
          set -euo pipefail
          if [ "${REASBOOK_REUSE_BRANCH_SITES:-true}" = "false" ]; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "[branch-site] reuse disabled"
            exit 0
          fi
          site_cache_dir="$PERSIST_ROOT/site_cache"
          site_dir="$site_cache_dir/site"
          marker="$site_cache_dir/.fingerprint"
          theorem_map_ref="$(git -C .reasbook-main rev-parse HEAD)"
          expected="$(printf '%s\n' "${BRANCH}-$(git rev-parse HEAD)-${REASBOOK_EXCLUDED_PROJECTS:-}-${REASBOOK_ONLY_PROJECTS:-}-${REASBOOK_DOMAIN:-}-${REASBOOK_ROOT_PATH:-}-${theorem_map_ref}" | sha256sum | awk '{print $1}')"
          actual="$(cat "$marker" 2>/dev/null || true)"
          if [ -n "$actual" ] && [ "$actual" = "$expected" ] && [ -f "$site_dir/index.html" ]; then
            rm -rf ReasBookWeb/_site
            mkdir -p ReasBookWeb
            cp -a "$site_dir" ReasBookWeb/_site
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "[branch-site] cache hit; reusing ${site_dir}"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "[branch-site] cache miss"
            rm -rf "$site_dir"
          fi

      - name: Install elan (Lean toolchain manager)
        if: steps.branch_site_reuse.outputs.hit != 'true'
        run: |
          if [ ! -x "${HOME:-/root}/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          fi

      - name: Restore ReasBook build cache
        if: steps.branch_site_reuse.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ReasBook/.lake/build/bin
            ReasBook/.lake/build/lib/lean
          key: lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}
          restore-keys: |
            lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-
            lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-
            lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore ReasBook doc-data cache
        if: steps.branch_site_reuse.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ReasBook/.lake/build/doc-data
          key: lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}
          restore-keys: |
            lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-
            lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-
            lake-reasbook-docdata-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore ReasBook doc cache
        if: steps.branch_site_reuse.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ReasBook/.lake/build/doc
          key: lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}
          restore-keys: |
            lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-
            lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-
            lake-reasbook-docfinal-v1-${{ runner.os }}-${{ runner.arch }}-
            lake-reasbook-doc-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-
            lake-reasbook-doc-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-
            lake-reasbook-doc-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore ReasBookWeb build cache
        if: steps.branch_site_reuse.outputs.hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ReasBookWeb/.lake/build/bin
            ReasBookWeb/.lake/build/lib/lean
          key: lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBookWeb/lean-toolchain') }}-${{ hashFiles('ReasBookWeb/lake-manifest.json') }}
          restore-keys: |
            lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBookWeb/lean-toolchain') }}-
            lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-
            lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Prime ReasBook cache
        if: steps.branch_site_reuse.outputs.hit != 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          if ! ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_cache.sh (${BRANCH})" ./scripts/build_reasbook_cache.sh; then
            echo "[${BRANCH}] cache get failed; continuing with local build"
          fi

      - name: Build ReasBook core target
        if: steps.branch_site_reuse.outputs.hit != 'true'
        timeout-minutes: 90
        run: |
          set -euo pipefail
          ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_core.sh (${BRANCH})" ./scripts/build_reasbook_core.sh

      - name: Build ReasBookWeb (sections + Verso)
        id: build_web
        if: steps.branch_site_reuse.outputs.hit != 'true'
        timeout-minutes: 360
        run: |
          set -euo pipefail
          ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_web.sh (${BRANCH})" ./scripts/build_reasbook_web.sh

      - name: Build shared docs (${BRANCH})
        if: steps.branch_site_reuse.outputs.hit != 'true'
        timeout-minutes: 180
        run: |
          set -euo pipefail
          if [ -f ReasBook/.lake/build/doc/index.html ] && [ -f ReasBook/.lake/build/doc/.reasbook-docs-marker ]; then
            expected="$(git rev-parse HEAD:ReasBook)"
            actual="$(tr -d '\r\n' < ReasBook/.lake/build/doc/.reasbook-docs-marker)"
            if [ "$actual" = "$expected" ]; then
              echo "[${BRANCH}] docs cache valid; skipping docs build"
              exit 0
            fi
          fi
          ulimit -s unlimited 2>/dev/null || true
          ./scripts/ci_retry_on_143.sh ./scripts/ci_heartbeat.sh "build_reasbook_shared_docs.sh (${BRANCH})" ./scripts/build_reasbook_shared_docs.sh
          cd ReasBook
          python3 - "$REASBOOK_DOC_PARALLELISM" "$REASBOOK_EXCLUDED_PROJECTS" "$REASBOOK_ONLY_PROJECTS" <<'PY'
          import concurrent.futures
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          parallelism = max(1, int(sys.argv[1] or os.cpu_count() or 1))
          excluded = {x.strip() for x in (sys.argv[2] or "").split(",") if x.strip()}
          only = {x.strip() for x in (sys.argv[3] or "").split(",") if x.strip()}

          lakefile = Path("lakefile.lean").read_text(encoding="utf-8") if Path("lakefile.lean").exists() else ""
          has_books_lib = bool(re.search(r'lean_lib\s+[«"]?Books[»"]?\s', lakefile))
          has_papers_lib = bool(re.search(r'lean_lib\s+[«"]?Papers[»"]?\s', lakefile))

          def selected(project: str) -> bool:
              if excluded and project in excluded:
                  return False
              if only and project not in only:
                  return False
              return True

          def git_blob_hash(path: str) -> str:
              try:
                  return subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:ReasBook/{path}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except subprocess.CalledProcessError:
                  return ""

          docs_root_files = ["lean-toolchain", "lakefile.lean", "lake-manifest.json"]
          docs_env_fingerprint = "|".join(f"{name}:{git_blob_hash(name)}" for name in docs_root_files)

          def project_fingerprint(kind: str, project: str) -> str | None:
              try:
                  tree = subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:ReasBook/{kind}/{project}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except subprocess.CalledProcessError:
                  return None
              return f"{tree}|{docs_env_fingerprint}"

          modules = []
          for kind in ("Books", "Papers"):
              root = Path(kind)
              leaf = "Book.lean" if kind == "Books" else "Paper.lean"
              if not root.is_dir():
                  continue
              for entry in sorted(root.glob(f"*/{leaf}")):
                  project = entry.parts[1]
                  if not selected(project):
                      print(f"[docs] skip project {project}")
                      continue
                  if kind == "Books" and has_books_lib:
                      mod = entry.with_suffix("").as_posix().replace("/", ".")
                  elif kind == "Papers" and has_papers_lib:
                      mod = entry.with_suffix("").as_posix().replace("/", ".")
                  else:
                      mod = entry.relative_to(kind).with_suffix("").as_posix().replace("/", ".")
                  modules.append((kind, project, mod, project_fingerprint(kind, project)))

          failed = []

          doc_dir = Path(".lake/build/doc")
          doc_dir.mkdir(parents=True, exist_ok=True)

          def build_docs(item: tuple[str, str, str, str | None]) -> None:
              kind, project, mod, fingerprint = item
              marker = doc_dir / f".{kind}_{project}.docs-marker"
              html = doc_dir / f"{mod.replace('.', '/')}.html"
              previous = marker.read_text(encoding="utf-8").strip() if marker.is_file() else ""
              if fingerprint and previous == fingerprint and html.is_file():
                  print(f"[docs] reuse {project}")
                  return
              log = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / f"docgen-{mod.replace('.', '_')}.log"
              with log.open("w", encoding="utf-8") as out:
                  proc = subprocess.run(
                      ["lake", "-R", "-Kenv=dev", "build", f"{mod}:docs"],
                      stdout=out,
                      stderr=subprocess.STDOUT,
                  )
              if proc.returncode != 0:
                  print(f"[docs] FAILED: {mod} (site continues without it)")
                  try:
                      print("".join(log.read_text(encoding="utf-8").splitlines(keepends=True)[-5:]).rstrip())
                  except Exception:
                      pass
                  failed.append(mod)
                  try:
                      marker.unlink()
                  except FileNotFoundError:
                      pass
              elif fingerprint:
                  marker.write_text(fingerprint + "\n", encoding="utf-8")

          if modules:
              print(f"[docs] building {len(modules)} project docs with parallelism={parallelism}")
              with concurrent.futures.ThreadPoolExecutor(max_workers=parallelism) as pool:
                  list(pool.map(build_docs, modules))

          overall_marker = doc_dir / ".reasbook-docs-marker"
          if failed:
              print(f"[docs] doc failures (skipping docs-marker so next run retries): {len(failed)}")
              try:
                  overall_marker.unlink()
              except FileNotFoundError:
                  pass
          else:
              head_tree = subprocess.check_output(["git", "rev-parse", "HEAD:ReasBook"], text=True).strip()
              overall_marker.write_text(head_tree + "\n", encoding="utf-8")
              print("[docs] all project docs built; docs-marker written")
          PY
          cd ..

      - name: Assemble docs under ReasBookWeb/_site/docs
        if: steps.branch_site_reuse.outputs.hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          ./scripts/ci_heartbeat.sh "assemble_site_docs.sh (${BRANCH})" ./scripts/assemble_site_docs.sh

      - name: Generate theorem dependency maps (${BRANCH})
        if: steps.branch_site_reuse.outputs.hit != 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          python3 .reasbook-main/tools/theorem_map/generate_all.py \
            --repo-root . \
            --site-root ReasBookWeb/_site \
            --branch "$BRANCH" \
            --repository "https://github.com/${GITHUB_REPOSITORY}" \
            --extractor .reasbook-main/tools/theorem_map/Extract.lean \
            --assets .reasbook-main/tools/theorem_map/assets

      - name: Upload branch site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.branch }}
          path: ReasBookWeb/_site
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: true

      - name: Save cached branch site
        if: steps.build_web.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${REASBOOK_REUSE_BRANCH_SITES:-true}" = "false" ]; then
            echo "[branch-site] reuse disabled; not caching site"
            exit 0
          fi
          site_cache_dir="$PERSIST_ROOT/site_cache"
          mkdir -p "$site_cache_dir"
          rm -rf "$site_cache_dir/site"
          cp -a ReasBookWeb/_site "$site_cache_dir/site"
          theorem_map_ref="$(git -C .reasbook-main rev-parse HEAD)"
          expected="$(printf '%s\n' "${BRANCH}-$(git rev-parse HEAD)-${REASBOOK_EXCLUDED_PROJECTS:-}-${REASBOOK_ONLY_PROJECTS:-}-${REASBOOK_DOMAIN:-}-${REASBOOK_ROOT_PATH:-}-${theorem_map_ref}" | sha256sum | awk '{print $1}')"
          printf '%s\n' "$expected" > "$site_cache_dir/.fingerprint"
          echo "[branch-site] cached site for fingerprint ${expected}"

      - name: Save ReasBook build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ReasBook/.lake/build/bin
            ReasBook/.lake/build/lib/lean
          key: lake-reasbook-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save ReasBookWeb build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ReasBookWeb/.lake/build/bin
            ReasBookWeb/.lake/build/lib/lean
          key: lake-reasbookweb-lite-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.branch }}-${{ hashFiles('ReasBookWeb/lean-toolchain') }}-${{ hashFiles('ReasBookWeb/lake-manifest.json') }}-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compress persistent cache
        if: always()
        continue-on-error: true
        run: |
          ./scripts/compress_persistent_cache.sh "$PERSIST_ROOT/reasbook_lake" || true

  merge-branch-sites:
    needs:
      - discover-projects
      - build-branch-sites
    if: |
      always() &&
      (needs.build-branch-sites.result == 'success' ||
       needs.build-branch-sites.result == 'failure')
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    env:
      VERSION_BRANCHES: ${{ needs.discover-projects.outputs.version_branches }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all branch site artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: .artifacts/branches

      - name: Merge branch sites (newest version wins)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path

          branches = json.loads(os.environ["VERSION_BRANCHES"])
          src_root = Path(".artifacts/branches")
          # NOTE: use a NON-hidden directory name ("site", not ".site") because
          # actions/upload-artifact@v4 excludes dot-prefixed (hidden) paths by default.
          dst_root = Path("site")
          if dst_root.exists():
              shutil.rmtree(dst_root)
          dst_root.mkdir(parents=True)

          # Each artifact is extracted under .artifacts/branches/site-<branch>/.
          # Copy oldest -> newest so newer branches overwrite duplicates (docs, books, papers).
          for branch in branches:
              src = src_root / f"site-{branch}"
              if not src.is_dir():
                  print(f"warning: no artifact for {branch}")
                  continue
              for item in src.iterdir():
                  dst = dst_root / item.name
                  if item.is_dir():
                      shutil.copytree(item, dst, dirs_exist_ok=True)
                  else:
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(item, dst)
              print(f"merged {branch}")

          # Basic sanity: the site must have a root index (Verso builds one).
          if not (dst_root / "index.html").is_file():
              print("warning: merged site has no root index.html")
          PY

      - name: Upload merged site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-monolith
          path: site
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: true

  assemble-pages-artifact:
    needs:
      - discover-projects
      - merge-branch-sites
    if: always() && needs.merge-branch-sites.result == 'success'
    runs-on: [self-hosted, Linux, X64, reasbook-public]
    outputs:
      pages_artifact_name: ${{ steps.pages_artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download merged site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-monolith
          path: .artifacts/monolith

      - name: Assemble partitioned sites tree
        env:
          PROJECTS_JSON: ${{ needs.discover-projects.outputs.projects }}
        run: |
          set -euo pipefail
          python3 scripts/assemble_pages_site.py

      - name: Rebuild cross-version theorem-map catalog
        run: |
          set -euo pipefail
          python3 tools/theorem_map/catalog.py --site-root .site

      - name: Verify generated site tree
        env:
          PROJECTS_JSON: ${{ needs.discover-projects.outputs.projects }}
        run: |
          set -euo pipefail
          ls -la .site
          test -d .site/docs
          test -f .site/theorem-maps/index.html
          python3 scripts/verify_pages_site.py

      - name: Compute Pages artifact name
        id: pages_artifact_name
        run: |
          set -euo pipefail
          echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.pages_artifact_name.outputs.name }}
          path: .site

  deploy:
    needs: assemble-pages-artifact
    if: always() && needs.assemble-pages-artifact.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.assemble-pages-artifact.outputs.pages_artifact_name }}
