name: Repair Lean errors

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Project kind
        type: choice
        options: [book, paper]
        default: book
        required: true
      project:
        description: Exact project name
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    uses: ./.github/workflows/automation.yml
    with:
      operation: repair
      book: ${{ inputs.kind == 'book' && inputs.project || '' }}
      paper: ${{ inputs.kind == 'paper' && inputs.project || '' }}
