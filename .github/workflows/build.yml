name: Build and Check Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Build ReasBook core
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      PERSIST_ROOT: ${{ vars.REASBOOK_PERSIST_ROOT }}

    steps:
      - uses: actions/checkout@v4

      - name: Link persistent .lake directory
        run: |
          set -euo pipefail
          persist_root="${PERSIST_ROOT:-/data/reasbook-ci}"
          mkdir -p "$persist_root/reasbook_lake"
          rm -rf ReasBook/.lake
          ln -sfn "$persist_root/reasbook_lake" ReasBook/.lake

      - name: Resolve dependencies
        run: cd ReasBook && lake resolve-deps

      - name: Prime mathlib cache
        run: cd ReasBook && lake exe cache get || true

      - name: Build ReasBook
        run: cd ReasBook && lake build

  build-docs:
    name: Docs (${{ matrix.module }})
    needs: build-core
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      PERSIST_ROOT: ${{ vars.REASBOOK_PERSIST_ROOT }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - Books/AchimKlenkeLean
          - Books/Analysis2_Tao_2022/Book
          - Books/BauschkeLean
          - Books/CombinatorialGroupTheory
          - Books/ConvexAnalysis_Rockafellar_1970/Book
          - Books/FirstOrderMethodsinOptimization
          - Books/IntegerProgramming_Conforti_2014/Book
          - Books/IntroductiontoRealAnalysisVolumeI_JiriLebl_2025/Book
          - Books/MayConciseRevised
          - Books/Nesterov
          - Books/Reaslib
          - Books/RiemannSurfaces
          - Books/Serre
          - Books/SmoothManifoldsLee
          - Books/cartan
          - Books/chapter1_reference_format
          - Books/stacks_project
          - Papers/OnSomeLocalRings_Maassaran_2025/Paper
          - Papers/SmoothMinimization_Nesterov_2004/Paper

    steps:
      - uses: actions/checkout@v4

      - name: Link persistent .lake directory
        run: |
          set -euo pipefail
          persist_root="${PERSIST_ROOT:-/data/reasbook-ci}"
          rm -rf ReasBook/.lake
          ln -sfn "$persist_root/reasbook_lake" ReasBook/.lake

      - name: Build docs (${{ matrix.module }})
        run: |
          mod="${{ matrix.module }}"
          mod="${mod//\//.}"
          cd ReasBook
          lake -R -Kenv=dev build "${mod}:docs"
