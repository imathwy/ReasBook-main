name: Build and Check Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Build ReasBook core
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Build ReasBook (resolves deps, gets mathlib cache, builds)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ReasBook
          use-mathlib-cache: true
          use-github-cache: true
          build: true
          test: false
          lint: false
          auto-config: false

  build-docs:
    name: Docs (${{ matrix.module }})
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module:
          - Books/AchimKlenkeLean
          - Books/Analysis2_Tao_2022/Book
          - Books/BauschkeLean
          - Books/CombinatorialGroupTheory
          - Books/ConvexAnalysis_Rockafellar_1970/Book
          - Books/FirstOrderMethodsinOptimization
          - Books/IntegerProgramming_Conforti_2014/Book
          - Books/IntroductiontoRealAnalysisVolumeI_JiriLebl_2025/Book
          - Books/MayConciseRevised
          - Books/Nesterov
          - Books/Reaslib
          - Books/RiemannSurfaces
          - Books/Serre
          - Books/SmoothManifoldsLee
          - Books/cartan
          - Books/chapter1_reference_format
          - Books/stacks_project
          - Papers/OnSomeLocalRings_Maassaran_2025/Paper
          - Papers/SmoothMinimization_Nesterov_2004/Paper

    steps:
      - uses: actions/checkout@v4

      # lean-action installs elan (with retry+toolcache) and restores .lake cache from build-core
      - name: Setup elan and restore build cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ReasBook
          use-mathlib-cache: true
          use-github-cache: true
          build: false
          test: false
          lint: false
          auto-config: false

      # resolve-deps ensures .lake/packages exist even on partial cache miss
      - name: Resolve dependencies
        run: cd ReasBook && lake resolve-deps

      - name: Build docs (${{ matrix.module }})
        run: |
          mod="${{ matrix.module }}"
          mod="${mod//\//.}"
          cd ReasBook
          lake -R -Kenv=dev build "${mod}:docs"
