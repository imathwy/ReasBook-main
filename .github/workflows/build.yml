name: Build and Check Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    name: Build ReasBook core
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore build cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ReasBook/.lake/build
          key: lake-reasbook-v1-${{ runner.os }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}
          restore-keys: |
            lake-reasbook-v1-${{ runner.os }}-${{ hashFiles('ReasBook/lean-toolchain') }}-

      - name: Prime mathlib cache
        run: |
          cd ReasBook
          lake exe cache get || true

      - name: Build ReasBook
        run: |
          cd ReasBook
          lake build

      - name: Save build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ReasBook/.lake/build
          key: lake-reasbook-v1-${{ runner.os }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-${{ github.run_id }}

  build-docs:
    name: Docs (${{ matrix.module }})
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module:
          - Books/AchimKlenkeLean
          - Books/Analysis2_Tao_2022
          - Books/BauschkeLean
          - Books/CombinatorialGroupTheory
          - Books/ConvexAnalysis_Rockafellar_1970
          - Books/FirstOrderMethodsinOptimization
          - Books/IntegerProgramming_Conforti_2014
          - Books/IntroductiontoRealAnalysisVolumeI_JiriLebl_2025
          - Books/MayConciseRevised
          - Books/Nesterov
          - Books/Reaslib
          - Books/RiemannSurfaces
          - Books/Serre
          - Books/SmoothManifoldsLee
          - Books/cartan
          - Books/chapter1_reference_format
          - Books/stacks_project
          - Papers/OnSomeLocalRings_Maassaran_2025
          - Papers/SmoothMinimization_Nesterov_2004

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ReasBook/.lake/build
          key: lake-reasbook-v1-${{ runner.os }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-reasbook-v1-${{ runner.os }}-${{ hashFiles('ReasBook/lean-toolchain') }}-${{ hashFiles('ReasBook/lake-manifest.json') }}-
            lake-reasbook-v1-${{ runner.os }}-${{ hashFiles('ReasBook/lean-toolchain') }}-

      - name: Prime mathlib cache
        run: |
          cd ReasBook
          lake exe cache get || true

      - name: Build docs (${{ matrix.module }})
        run: |
          mod="${{ matrix.module }}"
          mod="${mod//\//.}"
          cd ReasBook
          lake -R -Kenv=dev build "${mod}:docs"
