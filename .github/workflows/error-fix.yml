name: Error Fix

on:
  workflow_run:
    workflows: ["Sync from ALLBOOKS", "Check Toolchain"]
    types: [completed]

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Find latest error reports
        id: find
        run: |
          SYNC_REPORT=$(ls -t docs/sync-reports/*.md 2>/dev/null | head -1)
          UPGRADE_REPORT=$(ls -t docs/upgrade-reports/*.md 2>/dev/null | head -1)
          if [ -n "$SYNC_REPORT" ]; then
            echo "sync_report=$SYNC_REPORT" >> $GITHUB_OUTPUT
          fi
          if [ -n "$UPGRADE_REPORT" ]; then
            echo "upgrade_report=$UPGRADE_REPORT" >> $GITHUB_OUTPUT
          fi

      - name: Fix sync errors
        if: steps.find.outputs.sync_report != ''
        run: |
          python3 scripts/fix_errors.py --source "${{ steps.find.outputs.sync_report }}"

      - name: Fix upgrade errors
        if: steps.find.outputs.upgrade_report != ''
        run: |
          python3 scripts/fix_errors.py --source "${{ steps.find.outputs.upgrade_report }}"

      - name: Commit fixes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No fixes applied."
          else
            git commit -m "fix: auto-fix safe errors ($(date -I))"
            git push
          fi

      - name: Upload fix report
        uses: actions/upload-artifact@v4
        with:
          name: error-fix-report
          path: docs/error-fix-reports/
