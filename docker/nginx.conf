server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = / {
        return 308 /ReasBook/;
    }

    location = /ReasBook {
        return 308 /ReasBook/;
    }

    # The generated site uses the same repository prefix as GitHub Pages.
    # Alias that URL prefix to the image's site root without duplicating data.
    location /ReasBook/ {
        alias /usr/share/nginx/html/;
    }
}
