map $http_x_forwarded_proto $reviewer_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 128k;

    location = / {
        return 302 /ReasBook/;
    }

    # Preserve /ReasBook/ and /api/ so evidence, login, and book links share
    # the same routing contract as a direct reviewer deployment.
    location / {
        proxy_pass http://reviewer:8876;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $reviewer_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
