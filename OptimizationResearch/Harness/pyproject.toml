[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-harness"
version = "0.1.0"
description = "Deterministic controls and records for ALLBOOKS optimization experiments"
requires-python = ">=3.11"

[project.scripts]
optimization-harness = "optimization_harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

