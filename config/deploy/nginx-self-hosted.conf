server {
    listen 80;
    server_name _;

    # `current` is atomically replaced by the release installer. Keep open-file
    # caching disabled so every new request resolves the active release.
    root /srv/reasbook/current/public;
    index index.html;
    charset utf-8;
    autoindex off;
    etag on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 308 /ReasBook/;
    }

    location = /ReasBook {
        return 308 /ReasBook/;
    }

    location = /ReasBook/release-spec.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ReasBook/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
